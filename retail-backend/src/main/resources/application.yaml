spring:
  application:
    name: retail-backend
  security:
    user:
      name: dummy_user
      password: dummy_password

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/retail_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:0913280013}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-very-secure-default-secret-key-for-local-testing-only-12345!}
    expiration-ms: 86400000          # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

  upload:
    screenshots-dir: ${SCREENSHOTS_DIR:./uploads/screenshots}
    product-images-dir: ${PRODUCT_IMAGES_DIR:./uploads/products}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://10.216.177.228:5173}

logging:
  level:
    com.shop.retailbackend: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
